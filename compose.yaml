name: minifiles
services:
  minifiles:
    image: ${MINIFILES_IMAGE:-ghcr.io/metalogico/minifiles:latest}
    restart: unless-stopped
    user: "${MINIFILES_UID:-1000}:${MINIFILES_GID:-1000}"
    environment:
      MINIFILES_USERNAME: ${MINIFILES_USERNAME:?Set the username}
      MINIFILES_PASSWORD: ${MINIFILES_PASSWORD:?Set the password}
      MINIFILES_ORIGIN: ${MINIFILES_ORIGIN:?Set the web origin}
      MINIFILES_DATA_ROOT: /data
      MINIFILES_CONFIG_ROOT: /config
      MINIFILES_SESSION_SECONDS: ${MINIFILES_SESSION_SECONDS:-43200}
      MINIFILES_UPLOAD_IDLE_SECONDS: ${MINIFILES_UPLOAD_IDLE_SECONDS:-120}
      MINIFILES_MAX_UPLOADS: ${MINIFILES_MAX_UPLOADS:-4}
      MINIFILES_MAX_UPLOAD_BYTES: ${MINIFILES_MAX_UPLOAD_BYTES:-0}
      MINIFILES_RESERVE_BYTES: ${MINIFILES_RESERVE_BYTES:-1073741824}
    ports:
      - "${MINIFILES_BIND_IP:-127.0.0.1}:${MINIFILES_PORT:-8090}:8000"
    volumes:
      - type: bind
        source: ${MINIFILES_DATA_PATH:-./local-data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${MINIFILES_CONFIG_PATH:-./local-config}
        target: /config
        bind:
          create_host_path: false
    mem_limit: 512m
    cpus: 2
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
