name: Publish Docker images
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish minifiles
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/metalogico/minifiles:latest
            ghcr.io/metalogico/minifiles:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/metalogico/minifiles
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=min
          sbom: true
      - name: Publish minifiles-https
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.https
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/metalogico/minifiles-https:latest
            ghcr.io/metalogico/minifiles-https:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/metalogico/minifiles
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=min
          sbom: true
