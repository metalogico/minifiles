name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .github/scripts/check-migrations.py
      - name: Check installation packaging
        run: python3 .github/scripts/package-release.py
        env:
          RELEASE_VERSION: 0.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: ruff check backend scripts tests
      - run: ruff format --check backend scripts tests
      - run: npm ci && npm test && npm run format:check && npm run build
        working-directory: frontend
  containers:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build application for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: minifiles:ci
          cache-from: type=gha,scope=app-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.runner }}
      - name: Build HTTPS proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.https
          load: true
          tags: minifiles-https:ci
      - name: Check fresh install and persistence after recreation
        run: python3 .github/scripts/smoke-install.py
